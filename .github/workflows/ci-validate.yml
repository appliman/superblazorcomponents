name: Validate pull requests

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: validate-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true

jobs:
  validate:
    name: Build and test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Setup .NET 10 and .NET 11
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            10.0.x
            11.0.x
      - name: Restore
        run: |
          dotnet restore src/DemoWebSite/DemoWebSite.csproj
          dotnet restore tests/SuperBlazorComponents.Tests/SuperBlazorComponents.Tests.csproj
      - name: Build
        run: |
          dotnet build src/DemoWebSite/DemoWebSite.csproj --no-restore
          dotnet build tests/SuperBlazorComponents.Tests/SuperBlazorComponents.Tests.csproj --no-restore
      - name: Install Chromium
        shell: pwsh
        # GitHub's hosted Ubuntu runner already provides the Chromium system libraries.
        run: ./tests/SuperBlazorComponents.Tests/bin/Debug/net11.0/playwright.ps1 install chromium
      - name: Test
        run: dotnet test tests/SuperBlazorComponents.Tests/SuperBlazorComponents.Tests.csproj --no-build --no-restore -p:TestTfmsInParallel=false --logger trx --results-directory TestResults
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: TestResults/*.trx
          if-no-files-found: ignore
